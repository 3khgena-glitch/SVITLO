<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Комуналка</title>
    <!-- Підключаємо Tailwind CSS для дизайну -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        input[type="number"] { font-size: 16px; /* Запобігає зуму на iPhone */ }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-24 md:max-w-md md:mx-auto shadow-xl min-h-screen">

    <!-- Шапка з балансом -->
    <div class="bg-blue-600 text-white p-6 rounded-b-3xl shadow-lg sticky top-0 z-10">
        <h1 class="text-xl font-medium opacity-90 mb-1">Поточний залишок</h1>
        <div class="text-4xl font-bold" id="total-balance">0.00 ₴</div>
    </div>

    <!-- Контейнер для місяців -->
    <div id="records-container" class="p-4 space-y-4">
        <!-- Картки будуть додаватися сюди скриптом -->
    </div>

    <!-- Нижня кнопка додавання -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center pointer-events-none md:max-w-md md:mx-auto z-20">
        <button onclick="addMonth()" class="pointer-events-auto bg-blue-600 text-white rounded-full p-4 px-6 shadow-xl hover:bg-blue-700 transition-all flex items-center gap-2 font-medium text-lg">
            + Новий місяць
        </button>
    </div>

    <script>
        // Початкові дані (з Екселю для старту)
        let records = JSON.parse(localStorage.getItem('utility_records')) || [
            { id: '2024-07', name: 'Липень 2024', water: 620, gas: 50.17, paid: 0, meterVadik: 61648, meterMI: 5385, rate: 4.32 },
            { id: '2024-08', name: 'Серпень 2024', water: 907, gas: 50.17, paid: 2550, meterVadik: 61870, meterMI: 5497, rate: 4.32 }
        ];

        let expandedId = null;
        let startBalance = 2082.96; // Баланс на кінець липня

        function saveAndRender() {
            localStorage.setItem('utility_records', JSON.stringify(records));
            render();
        }

        function toggleExpand(id) {
            expandedId = expandedId === id ? null : id;
            render();
        }

        function updateField(id, field, value) {
            const numVal = value === '' ? 0 : parseFloat(value);
            const record = records.find(r => r.id === id);
            if (record) {
                record[field] = numVal;
                saveAndRender();
            }
        }

        function deleteRecord(id) {
            if(confirm('Видалити цей місяць?')) {
                records = records.filter(r => r.id !== id);
                saveAndRender();
            }
        }

        function addMonth() {
            const lastRecord = records[records.length - 1];
            const now = new Date();
            const newId = now.getTime().toString(); // Унікальний ID
            
            records.push({
                id: newId,
                name: 'Новий місяць',
                water: 0,
                gas: 50.17,
                paid: 0,
                meterVadik: lastRecord ? lastRecord.meterVadik : 0,
                meterMI: lastRecord ? lastRecord.meterMI : 0,
                rate: 4.32
            });
            expandedId = newId; // Відразу відкриваємо новий місяць
            saveAndRender();
        }

        function render() {
            const container = document.getElementById('records-container');
            container.innerHTML = '';
            
            let currentBalance = startBalance;
            let currentTotal = 0;

            // Розрахунок
            const calculated = records.map((rec, index) => {
                const prevRec = index > 0 ? records[index - 1] : null;
                let cMI = 0, cVadik = 0;

                if (prevRec && rec.meterMI > 0 && rec.meterVadik > 0) {
                    cMI = rec.meterMI - prevRec.meterMI;
                    cVadik = (rec.meterVadik - prevRec.meterVadik) - cMI;
                }

                const lightCost = cVadik > 0 ? -(cVadik * rec.rate) : 0;
                const prevBalance = index > 0 ? currentBalance : currentBalance;
                
                currentBalance = prevBalance + rec.water + rec.gas + lightCost - rec.paid;
                currentTotal = currentBalance;

                return { ...rec, cMI, cVadik, lightCost, prevBalance, monthBalance: currentBalance };
            }).reverse(); // Нові зверху

            // Оновлення шапки
            document.getElementById('total-balance').innerText = currentTotal.toFixed(2) + ' ₴';

            // Малювання карток
            calculated.forEach(rec => {
                const isExpanded = expandedId === rec.id;
                const balColor = rec.monthBalance >= 0 ? 'text-green-600' : 'text-red-500';
                
                let detailsHtml = '';
                if (isExpanded) {
                    detailsHtml = `
                        <div class="p-4 pt-0 border-t border-gray-50">
                            <!-- Назва -->
                            <div class="mb-4">
                                <label class="block text-xs text-gray-500 mb-1">Назва місяця</label>
                                <input type="text" value="${rec.name}" onchange="records.find(r=>r.id=='${rec.id}').name=this.value; saveAndRender()" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 font-medium">
                            </div>

                            <!-- Лічильники -->
                            <div class="bg-gray-50 p-3 rounded-xl mb-4">
                                <h3 class="text-sm font-semibold text-gray-500 mb-2 uppercase">Лічильники</h3>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs text-gray-500 mb-1">Вадік (Загальний)</label>
                                        <input type="number" value="${rec.meterVadik || ''}" oninput="updateField('${rec.id}', 'meterVadik', this.value)" class="w-full bg-white border border-gray-200 rounded-lg p-2 text-lg">
                                        <div class="text-xs text-gray-400 mt-1">Споживання: ${rec.cVadik}</div>
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-500 mb-1">МИ</label>
                                        <input type="number" value="${rec.meterMI || ''}" oninput="updateField('${rec.id}', 'meterMI', this.value)" class="w-full bg-white border border-gray-200 rounded-lg p-2 text-lg">
                                        <div class="text-xs text-gray-400 mt-1">Споживання: ${rec.cMI}</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Фінанси -->
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Вода (грн)</label>
                                    <input type="number" value="${rec.water || ''}" oninput="updateField('${rec.id}', 'water', this.value)" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-lg">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Газ (грн)</label>
                                    <input type="number" value="${rec.gas || ''}" oninput="updateField('${rec.id}', 'gas', this.value)" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-lg">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Оплачено (грн)</label>
                                    <input type="number" value="${rec.paid || ''}" oninput="updateField('${rec.id}', 'paid', this.value)" class="w-full bg-green-50 border border-green-200 rounded-lg p-2 text-lg text-green-700 font-semibold">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Тариф Світло</label>
                                    <input type="number" step="0.01" value="${rec.rate || ''}" oninput="updateField('${rec.id}', 'rate', this.value)" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-lg">
                                </div>
                            </div>

                            <!-- Підсумок -->
                            <div class="bg-blue-50 text-blue-900 p-3 rounded-xl text-sm space-y-1 mb-4">
                                <div class="flex justify-between"><span>Залишок з минулого:</span><span>${rec.prevBalance.toFixed(2)} ₴</span></div>
                                <div class="flex justify-between font-medium"><span>Світло Вадік:</span><span class="text-red-600">${rec.lightCost.toFixed(2)} ₴</span></div>
                            </div>

                            <button onclick="deleteRecord('${rec.id}')" class="w-full py-3 text-red-500 bg-red-50 hover:bg-red-100 rounded-lg transition-colors text-sm font-medium">Видалити місяць</button>
                        </div>
                    `;
                }

                const cardHtml = `
                    <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                        <div class="p-4 flex justify-between items-center cursor-pointer" onclick="toggleExpand('${rec.id}')">
                            <div>
                                <h2 class="font-semibold text-lg">${rec.name}</h2>
                                <p class="text-sm ${balColor}">Баланс: ${rec.monthBalance.toFixed(2)} ₴</p>
                            </div>
                            <div class="text-gray-400 text-xl font-bold">${isExpanded ? '−' : '+'}</div>
                        </div>
                        ${detailsHtml}
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Перший запуск
        render();
    </script>
</body>
</html>
