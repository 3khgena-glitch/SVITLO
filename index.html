    <div class="bg-white w-full md:max-w-md rounded-t-3xl md:rounded-2xl p-6 pb-10 shadow-2xl slide-up">

<div class="fixed bottom-6 left-0 right-0 flex justify-center gap-3 pointer-events-none md:max-w-md md:mx-auto z-20 px-4">

        💳 Оплата
    </button>

        + Новий місяць
    </button>
</div>

<script>
    const defaultRecords = [
        { id: '2024-07', name: 'Липень 2024 (Старт)', water: 0, gas: 0, paid: 0, meterVadik: 61648, meterMI: 5385, rate: 4.32 },
        { id: '2024-08', name: 'Серпень 2024', water: 907, gas: 50.17, paid: 2550, meterVadik: 61870, meterMI: 5497, rate: 4.32 }
    ];

    let records = JSON.parse(localStorage.getItem('utility_records_v2')) || defaultRecords;
    let expandedId = null;
    let startBalance = 2082.96;

    function saveAndRender() {
        localStorage.setItem('utility_records_v2', JSON.stringify(records));
        render();
    }

    // Нова функція для відкриття/закриття налаштувань
    function toggleSettings() {
        const screen = document.getElementById('settings-screen');
        if (screen.classList.contains('hidden')) {
            screen.classList.remove('hidden');
            screen.classList.add('flex');
            document.body.style.overflow = 'hidden'; 
        } else {
            screen.classList.add('hidden');
            screen.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }
    }

    function togglePaymentScreen() {
        const paymentScreen = document.getElementById('payment-screen');
        if (paymentScreen.classList.contains('hidden')) {
            paymentScreen.classList.remove('hidden');
            paymentScreen.classList.add('flex', 'slide-up');
            document.body.style.overflow = 'hidden'; 
        } else {
            paymentScreen.classList.add('hidden');
            paymentScreen.classList.remove('flex', 'slide-up');
            document.body.style.overflow = 'auto';
        }
    }

    function savePayment() {
        const amountInput = document.getElementById('payment-amount');
        const value = amountInput.value.replace(',', '.');
        const amount = parseFloat(value);
        
        if (isNaN(amount) || amount <= 0) {
            alert('Будь ласка, введіть суму більшу за нуль.');
            return;
        }

        if (records.length > 0) {
            const latestRecord = records[records.length - 1];
            latestRecord.paid = amount;
            saveAndRender();
            
            amountInput.value = ''; 
            togglePaymentScreen(); 
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            alert('Немає створених місяців.');
        }
    }

    function resetData() {
        if(confirm('Увага! Це видалить всі введені дані і поверне історію до Серпня 2024. Продовжити?')) {
            records = JSON.parse(JSON.stringify(defaultRecords));
            saveAndRender();
        }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "komunalka_backup.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    function exportCSV() {
        let currentBalance = startBalance;
        const calculated = records.map((rec, index) => {
            const prevRec = index > 0 ? records[index - 1] : null;
            let cMI = 0, cVadik = 0;
            if (prevRec && rec.meterMI > 0 && rec.meterVadik > 0) {
                cMI = rec.meterMI - prevRec.meterMI;
                cVadik = (rec.meterVadik - prevRec.meterVadik) - cMI;
            }
            const lightCost = cVadik > 0 ? -(cVadik * rec.rate) : 0;
            const prevBalance = index > 0 ? currentBalance : currentBalance;
            currentBalance = prevBalance + rec.water + rec.gas + lightCost - rec.paid;
            return { ...rec, cMI, cVadik, lightCost, prevBalance, monthBalance: currentBalance };
        });

        let csvContent = "\uFEFF"; 
        csvContent += "Місяць;Лічильник Вадік;Лічильник МИ;Споживання Вадік;Споживання МИ;Вода (грн);Газ (грн);Оплачено (грн);Тариф Світло;Світло Вадік (грн);Залишок (грн)\n";

        calculated.forEach(rec => {
            const row = [
                `"${rec.name}"`,
                rec.meterVadik,
                rec.meterMI,
                rec.cVadik,
                rec.cMI,
                rec.water,
                rec.gas,
                rec.paid,
                rec.rate,
                rec.lightCost.toFixed(2),
                rec.monthBalance.toFixed(2)
            ].map(val => String(val).replace('.', ',')).join(";"); 
            csvContent += row + "\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "komunalka_export.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported) && imported.length > 0) {
                    records = imported;
                    saveAndRender();
                    alert('Дані успішно відновлено!');
                } else {
                    alert('Неправильний формат файлу.');
                }
            } catch (err) {
                alert('Помилка читання файлу. Перевірте формат.');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function toggleExpand(id) {
        expandedId = expandedId === id ? null : id;
        render();
    }

    function updateField(id, field, value) {
        value = value.replace(',', '.');
        const numVal = value === '' ? 0 : parseFloat(value);
        const record = records.find(r => r.id === id);
        if (record) {
            record[field] = numVal;
            saveAndRender();
        }
    }

    function deleteRecord(id) {
        if(confirm('Видалити цей місяць?')) {
            records = records.filter(r => r.id !== id);
            saveAndRender();
        }
    }

    function addMonth() {
        const lastRecord = records[records.length - 1];
        const now = new Date();
        const newId = now.getTime().toString();
        
        records.push({
            id: newId,
            name: 'Новий місяць',
            water: 0,
            gas: 50.17,
            paid: 0,
            meterVadik: lastRecord ? lastRecord.meterVadik : 0,
            meterMI: lastRecord ? lastRecord.meterMI : 0,
            rate: 4.32
        });
        expandedId = newId; 
        saveAndRender();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
